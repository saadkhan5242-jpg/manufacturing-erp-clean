apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: erp-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: erp.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: erp-backend-service
                port:
                  number: 4000
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: erp-backend-service
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: erp-frontend-service
                port:
                  number: 80
