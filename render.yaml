services:
  # 1. Backend Web Service
  - type: web
    name: manufacturing-erp-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run db:migrate && npx prisma generate
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: erp-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ERP_ADMIN_PASSWORD
        sync: false
      - key: SUPERVISOR_PIN
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: VERCEL_PROJECT_SLUG
        sync: false
      - key: VERCEL_ALLOWED_DOMAINS
        sync: false
      - key: DATABASE_POOL_MAX
        value: 5
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: 8000

  # 2. Frontend Static Site
  - type: web
    name: manufacturing-erp-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  # Render Managed PostgreSQL Database
  - name: erp-postgres
    databaseName: manufacturing_erp
    user: erp_user
    plan: free
